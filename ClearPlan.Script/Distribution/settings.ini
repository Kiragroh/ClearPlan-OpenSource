; ClearPlan path settings
; Relative paths are resolved from the build folder.

[Paths]
MlcGeometryProfilesJsonPath=MachineGeometry\MlcGeometryProfiles.example.json
DoseRateProfilesJsonPath=MachineGeometry\DoseRateProfiles.example.json
; No generic clinical device dimensions. Supply a locally commissioned profile through Settings.
CollisionProfilesJsonPath=
SourceCollisionModelsJsonPath=
AriaUploadConfigJsonPath=
; Editable Default target rules. Blank, deleted file, disabled rules or an empty rules array run no rules.
DefaultReviewRulesJsonPath=DefaultReviewRules.json
; Editable read-only field-name tokens/order. Blank/deleted/disabled rules give NotEvaluated previews.
FieldNamingRulesJsonPath=FieldNamingRules.json
IsodoseDisplayJsonPath=IsodoseDisplay.json
; No public scanner approvals. Configure explicit local manufacturer/model/serial/HU tuples.
CtCompatibilityJsonPath=CtCompatibility.json
RefDbJsonPath =
; Portable stock OAR tables; every stock table requires explicit confirmation.
ExcelWorkbookPath = ConstraintTemplates/ClearPlan_StockConstraints2024.xlsx
; Optional explicit name overrides. Blank preserves the selected source mappings.
StructureAliasesJsonPath =
ConstraintTemplatesDirectory = ConstraintTemplates
DefaultConventionalTemplate = ClearPlan_StockConstraints2024.xlsx
DefaultHypofractionatedTemplate = ClearPlan_StockConstraints2024.xlsx
; Legacy compatibility field only. Stock 2024 contains no PlanSum table.
DefaultPlanSumTemplate = ClearPlan_DefaultConstraints.xlsx
LogsDirectory = Logs
ReportsDirectory = Reports
CsvExportDirectory = Exports
StateDirectory = State
ConfigurationDirectory = Configuration
UsageLogFile = Logs/ClearPlan_UserLog.csv
ActivityLogFile = Logs/ActivityLog.csv
VersionSeenUsersFile = State/seen_versions.csv
ChangeLogFile = CHANGELOG.md
FeedbackFile = FEEDBACK.md
PrescriptionSettingsPath =
PlanCheckResourcesPath =
